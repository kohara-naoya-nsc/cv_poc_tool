# ---------------------------------------------
# 共通設定セクション
# ---------------------------------------------
[common]
# 処理対象の画像の拡張子
image_suffix=[".jpg", ".JPG", ".png", ".PNG"]


# ---------------------------------------------
# ロギング設定セクション
# ---------------------------------------------
[logging]
# ログ出力先ディレクトリ(存在しないディレクトリの場合はエラーとなります)
log_file_dir=/kqi/output
# ログファイル名
log_file_name=gzo_fw.log
# ログローテーション単位
# "S":秒, "M":分, "H":時間, "D":日, "W0"-"W6":月-日, "midnight":深夜0時
log_when=D
# ログローテーション間隔(※整数)
# LOG_WHEN * LOG_INTERVALの間隔ごとにログファイルが作成されます。
log_interval=1
# ログファイル最大保持数(※整数)
# この数を超える場合、古いものから削除されます
log_backup_count=30
# ログレベル
# "CRITICAL", "ERROR", "WARNING", "INFO", "DEBUG"のいずれか
log_level=INFO

# ---------------------------------------------
# 描画設定セクション
# ---------------------------------------------
[draw_detection]
#スコアの四捨五入位置
score_round=0.01
# 文字のフォント
# 1 -> FONT_HERSHEY_PLAINを指定
font_type=1
# 文字の大きさ
font_size=1
# 線のタイプ
# 16 -> LINE_AAを指定
line_type=16
# 線の太さ
line_thickness=2
# 色（114色）
