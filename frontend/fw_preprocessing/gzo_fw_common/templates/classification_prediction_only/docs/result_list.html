<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/datatable-bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <title>結果一覧画面</title>
</head>

<body>
    <div id="result_list_table">
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="./index.html">基本情報</a></li>
                    <li class="nav-item active"><a class="nav-link" href="./result_list.html">結果一覧</a></li>
                    <li class="nav-item"><a class="nav-link" href="./result_summary.html">全体評価</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <div class="legend">
                <p>【凡例】
                    <font color="green">スコアが{{evaluation_score_thresh}}未満</font>
                </p>
            </div>
            <div class="table-box">
                <table class="table table-bordered sticky-table">
                    <thead class="result_table_head">
                        <tr>
                            <th>No.</th>
                            <th>画像</th>
                            <th>推論クラス</th>
                            <th>スコア</th>
                            <th>元画像</th>
                        </tr>
                    </thead>
                    <tbody class="result_table_body">
                        <tr v-for="item in computed_list">
                            <td>
                                <div class="text_data">{{item.index}}</div>
                            </td>
                            <td>
                                <div class="centered_block"><img class="object-image lazyload"
                                        v-bind:src="item.classificated_image_path"></div>
                            </td>
                            <td>
                                <div class="text_data label_data" v-bind:class="item.object_class">
                                    {{item.classification_class}}
                                </div>
                            </td>
                            <td>
                                <div class="float_data" v-bind:class="item.object_class">{{item.classification_score}}
                                </div>
                            </td>
                            <td><a class="image_url" v-bind:href="item.classificated_image_path"
                                    target="_blank">{{item.classificated_image}}</a></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="paging_block">
                <div id="paging_result_list_table"></div>
                <div class="pagesize_selector">
                    <div class="pagesize_selector_box">
                        <div class="pagesize_selector_text">項目数/ページ：</div>
                        <input type="number" min="1" id="page-size-input" name="input-button" value="20">
                        <input type="button" class="button1" value="適用">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="text/javascript" src="./js/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" src="./js/vue.js"></script>
    <script type="text/javascript" src="./js/bootstrap.min.js"></script>
    <script type="text/javascript" src="./js/datatable.min.js"></script>
    <script type="text/javascript" src="./js/datatable.jquery.min.js"></script>
    <script type="text/javascript" src="./js/script.js"></script>
    <script type="text/javascript" src="./results/result_data.js"></script>
    <script type="text/javascript" src="./js/result_list.js"></script>
</body>

</html>
